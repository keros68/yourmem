[package]
name = "yourmem-app"
version = "1.1.3"
edition = "2021"
description = "yourmem desktop app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = "0.32"
yourmem = { path = ".." }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true

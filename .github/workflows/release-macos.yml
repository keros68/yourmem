name: Release desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      # tauri-action updates one shared latest.json. Serializing the three
      # builders avoids parallel delete/upload races while preserving every OS.
      max-parallel: 1
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            manual: false
            args: --bundles nsis
          - name: macOS Apple Silicon
            platform: macos-latest
            manual: true
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel
            platform: macos-latest
            manual: true
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg

    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push' || matrix.manual

      - name: Add Rust target
        if: (github.event_name == 'push' || matrix.manual) && matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Build and upload installer
        if: github.event_name == 'push' || matrix.manual
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: yourmem v__VERSION__
          releaseBody: macOS and Windows release assets for yourmem v__VERSION__.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
